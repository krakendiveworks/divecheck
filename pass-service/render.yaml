services:
  - type: web
    name: divecheck-pass-service
    runtime: node
    plan: free
    rootDir: pass-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PASS_TYPE_IDENTIFIER
        sync: false
      - key: TEAM_IDENTIFIER
        sync: false
      - key: WWDR_CERT_BASE64
        sync: false
      - key: SIGNER_CERT_BASE64
        sync: false
      - key: SIGNER_KEY_BASE64
        sync: false
      - key: SIGNER_KEY_PASSPHRASE
        sync: false
      - key: SHARED_SECRET
        sync: false
